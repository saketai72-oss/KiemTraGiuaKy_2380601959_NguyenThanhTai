<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 840" width="1260" height="840" style="background:#1E1E1E; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Label -->
  <text x="40" y="36" fill="#8E8E8E" font-size="14" font-weight="600">FIGMA WIREFRAME TEMPLATE • MOBILE APP FLOW (PLACEHOLDER WIREFRAME)</text>

  <!-- ==================== SCREEN 1: EXAM CATALOG (X: 40, Y: 60) ==================== -->
  <g transform="translate(40, 60)">
    <!-- Label -->
    <text x="4" y="-10" fill="#CBD5E1" font-size="12" font-weight="600">01. Mobile - Catalog Screen</text>
    <text x="310" y="-10" fill="#64748B" font-size="11" font-family="monospace">360 × 740</text>

    <!-- Phone Body -->
    <rect width="360" height="740" rx="36" fill="#F8FAFC" filter="url(#shadow)"/>
    <rect width="360" height="740" rx="36" fill="none" stroke="#334155" stroke-width="6"/>

    <!-- Status Bar -->
    <path d="M 0,36 A 36,36 0 0,1 36,0 L 324,0 A 36,36 0 0,1 360,36 L 360,44 L 0,44 Z" fill="#1E3A8A"/>
    <text x="28" y="28" fill="#FFFFFF" font-size="12" font-weight="600">9:41</text>
    <rect x="135" y="10" width="90" height="18" rx="9" fill="#000000"/>
    <text x="295" y="28" fill="#FFFFFF" font-size="11">5G 100%</text>

    <!-- Header Section -->
    <rect y="44" width="360" height="90" fill="#1E3A8A"/>
    <text x="24" y="80" fill="#FFFFFF" font-size="15" font-weight="700">[App Title / Brand]</text>
    <rect x="235" y="65" width="100" height="22" rx="11" fill="rgba(255,255,255,0.2)"/>
    <text x="247" y="80" fill="#FFFFFF" font-size="11" font-weight="500">[User Badge]</text>
    <text x="24" y="108" fill="#BFDBFE" font-size="12">[Subtitle / Instruction Text Placeholder]</text>

    <!-- Featured Card -->
    <g transform="translate(18, 150)">
      <rect width="324" height="180" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <rect x="14" y="14" width="75" height="20" rx="10" fill="#2563EB"/>
      <text x="24" y="28" fill="#FFFFFF" font-size="10" font-weight="700">[Tag 1]</text>
      <circle cx="295" cy="24" r="4" fill="#10B981"/>
      <text x="238" y="28" fill="#059669" font-size="11" font-weight="600">[Status Label]</text>

      <text x="14" y="62" fill="#0F172A" font-size="16" font-weight="700">[Featured Exam Title Placeholder]</text>

      <g transform="translate(14, 80)">
        <text x="0" y="14" fill="#64748B" font-size="12">[Duration]   •   [Question Count]   •   [Max Score]</text>
      </g>

      <g transform="translate(14, 110)">
        <rect width="90" height="20" rx="6" fill="#EFF6FF"/>
        <text x="16" y="14" fill="#1E40AF" font-size="10" font-weight="600">[Section 1 Tag]</text>
        <rect x="100" y="0" width="90" height="20" rx="6" fill="#EFF6FF"/>
        <text x="116" y="14" fill="#1E40AF" font-size="10" font-weight="600">[Section 2 Tag]</text>
        <rect x="200" y="0" width="95" height="20" rx="6" fill="#EFF6FF"/>
        <text x="216" y="14" fill="#1E40AF" font-size="10" font-weight="600">[Section 3 Tag]</text>
      </g>

      <!-- CTA Button -->
      <rect x="14" y="136" width="296" height="34" rx="8" fill="#2563EB"/>
      <text x="100" y="158" fill="#FFFFFF" font-size="13" font-weight="600">[Start Exam Button] ▶</text>
    </g>

    <!-- List Item Card 1 -->
    <g transform="translate(18, 345)">
      <rect width="324" height="85" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="30" fill="#0F172A" font-size="14" font-weight="700">[Exam Item Title Placeholder 1]</text>
      <text x="14" y="52" fill="#64748B" font-size="11">[Duration Meta]  •  [Question Count Meta]</text>
      <rect x="230" y="20" width="80" height="24" rx="6" fill="#ECFDF5"/>
      <text x="242" y="36" fill="#047857" font-size="11" font-weight="700">[Score Result]</text>
      <text x="14" y="72" fill="#3B82F6" font-size="11" font-weight="600">[Review Action Link &gt;]</text>
    </g>

    <!-- List Item Card 2 -->
    <g transform="translate(18, 442)">
      <rect width="324" height="85" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="30" fill="#0F172A" font-size="14" font-weight="700">[Exam Item Title Placeholder 2]</text>
      <text x="14" y="52" fill="#64748B" font-size="11">[Duration Meta]  •  [Question Count Meta]</text>
      <rect x="230" y="20" width="80" height="24" rx="6" fill="#EFF6FF"/>
      <text x="242" y="36" fill="#1D4ED8" font-size="11" font-weight="700">[Score Result]</text>
      <text x="14" y="72" fill="#3B82F6" font-size="11" font-weight="600">[Review Action Link &gt;]</text>
    </g>

    <!-- Home indicator -->
    <rect x="120" y="724" width="120" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- ==================== SCREEN 2: READING EXAM TEST (X: 450, Y: 60) ==================== -->
  <g transform="translate(450, 60)">
    <!-- Label -->
    <text x="4" y="-10" fill="#CBD5E1" font-size="12" font-weight="600">02. Mobile - Exam Taking View</text>
    <text x="310" y="-10" fill="#64748B" font-size="11" font-family="monospace">360 × 740</text>

    <!-- Phone Body -->
    <rect width="360" height="740" rx="36" fill="#F8FAFC" filter="url(#shadow)"/>
    <rect width="360" height="740" rx="36" fill="none" stroke="#334155" stroke-width="6"/>

    <!-- Status Bar -->
    <path d="M 0,36 A 36,36 0 0,1 36,0 L 324,0 A 36,36 0 0,1 360,36 L 360,44 L 0,44 Z" fill="#1E3A8A"/>
    <text x="28" y="28" fill="#FFFFFF" font-size="12" font-weight="600">9:42</text>
    <rect x="135" y="10" width="90" height="18" rx="9" fill="#000000"/>
    <text x="295" y="28" fill="#FFFFFF" font-size="11">5G 100%</text>

    <!-- Exam Top Action Bar -->
    <rect y="44" width="360" height="48" fill="#1E3A8A"/>
    <text x="18" y="74" fill="#FFFFFF" font-size="12" font-weight="600">[Q Index / Total]</text>
    <rect x="145" y="54" width="80" height="26" rx="13" fill="#EF4444"/>
    <text x="156" y="72" fill="#FFFFFF" font-size="12" font-weight="700">⏱ [00:00]</text>
    <rect x="270" y="55" width="75" height="25" rx="6" fill="#DC2626"/>
    <text x="280" y="72" fill="#FFFFFF" font-size="11" font-weight="600">[Submit CTA]</text>

    <!-- Passage Container Placeholder -->
    <g transform="translate(16, 102)">
      <rect width="328" height="185" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect width="4" height="185" rx="2" fill="#2563EB"/>
      <text x="14" y="24" fill="#2563EB" font-size="11" font-weight="700">[SECTION / PASSAGE HEADER PLACEHOLDER]</text>
      <line x1="14" y1="32" x2="314" y2="32" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="48" fill="#475569" font-size="11">[Metadata Line 1: Header / Author / Source Placeholder]</text>
      <text x="14" y="65" fill="#475569" font-size="11">[Metadata Line 2: Recipient / Date / Target Placeholder]</text>
      <text x="14" y="82" fill="#475569" font-size="11">[Metadata Line 3: Subject / Topic Description Placeholder]</text>
      <line x1="14" y1="92" x2="314" y2="92" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="112" fill="#334155" font-size="11">[Reading Passage Paragraph 1 Content Placeholder]</text>
      <text x="14" y="128" fill="#334155" font-size="11">[Reading Passage Paragraph 2 Content Placeholder]</text>
      <text x="14" y="144" fill="#334155" font-size="11">[Reading Passage Paragraph 3 Content Placeholder]</text>
      <text x="14" y="160" fill="#334155" font-size="11">[Reading Passage Footer / Notes Placeholder]</text>
    </g>

    <!-- Question Box -->
    <g transform="translate(16, 298)">
      <rect width="328" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" fill="#0F172A" font-size="13" font-weight="700">[Question Stem / Prompt Text Placeholder]</text>

      <!-- Option A -->
      <g transform="translate(14, 42)">
        <rect width="300" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
        <text x="19" y="28" fill="#0F172A" font-size="11" font-weight="700">A</text>
        <text x="46" y="28" fill="#334155" font-size="11">[Option A Text Placeholder]</text>
      </g>

      <!-- Option B (Selected) -->
      <g transform="translate(14, 98)">
        <rect width="300" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
        <circle cx="24" cy="24" r="12" fill="#2563EB"/>
        <text x="19" y="28" fill="#FFFFFF" font-size="11" font-weight="700">B</text>
        <text x="46" y="28" fill="#1E3A8A" font-size="11" font-weight="600">[Option B Text Placeholder (Selected)]</text>
      </g>

      <!-- Option C -->
      <g transform="translate(14, 154)">
        <rect width="300" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
        <text x="19" y="28" fill="#0F172A" font-size="11" font-weight="700">C</text>
        <text x="46" y="28" fill="#334155" font-size="11">[Option C Text Placeholder]</text>
      </g>

      <!-- Option D -->
      <g transform="translate(14, 210)">
        <rect width="300" height="48" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="24" cy="24" r="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
        <text x="19" y="28" fill="#0F172A" font-size="11" font-weight="700">D</text>
        <text x="46" y="28" fill="#334155" font-size="11">[Option D Text Placeholder]</text>
      </g>

      <!-- Buttons Prev / Flag / Next -->
      <g transform="translate(14, 276)">
        <rect width="80" height="34" rx="6" fill="#F1F5F9"/>
        <text x="14" y="22" fill="#475569" font-size="11" font-weight="600">◀ [Previous]</text>
        <rect x="90" y="0" width="80" height="34" rx="6" fill="#FEF3C7"/>
        <text x="105" y="22" fill="#92400E" font-size="11" font-weight="600">🔖 [Flag]</text>
        <rect x="180" y="0" width="120" height="34" rx="6" fill="#2563EB"/>
        <text x="210" y="22" fill="#FFFFFF" font-size="11" font-weight="600">[Next] ▶</text>
      </g>
    </g>

    <!-- Home indicator -->
    <rect x="120" y="724" width="120" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- ==================== SCREEN 3: SCORE REPORT (X: 860, Y: 60) ==================== -->
  <g transform="translate(860, 60)">
    <!-- Label -->
    <text x="4" y="-10" fill="#CBD5E1" font-size="12" font-weight="600">03. Mobile - Result Screen</text>
    <text x="310" y="-10" fill="#64748B" font-size="11" font-family="monospace">360 × 740</text>

    <!-- Phone Body -->
    <rect width="360" height="740" rx="36" fill="#F8FAFC" filter="url(#shadow)"/>
    <rect width="360" height="740" rx="36" fill="none" stroke="#334155" stroke-width="6"/>

    <!-- Status Bar -->
    <path d="M 0,36 A 36,36 0 0,1 36,0 L 324,0 A 36,36 0 0,1 360,36 L 360,44 L 0,44 Z" fill="#1E3A8A"/>
    <text x="28" y="28" fill="#FFFFFF" font-size="12" font-weight="600">9:46</text>
    <rect x="135" y="10" width="90" height="18" rx="9" fill="#000000"/>
    <text x="295" y="28" fill="#FFFFFF" font-size="11">5G 100%</text>

    <!-- Top Score Dial Banner -->
    <path d="M 0,44 L 360,44 L 360,260 A 24,24 0 0,1 336,284 L 24,284 A 24,24 0 0,1 0,260 Z" fill="url(#scoreGrad)"/>
    <text x="90" y="75" fill="#BFDBFE" font-size="12" font-weight="700" letter-spacing="1">[RESULT TITLE PLACEHOLDER]</text>

    <!-- Dial Circle -->
    <circle cx="180" cy="160" r="60" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="10"/>
    <circle cx="180" cy="160" r="60" fill="none" stroke="#60A5FA" stroke-width="10" stroke-dasharray="280" stroke-dashoffset="60"/>
    <text x="140" y="165" fill="#FFFFFF" font-size="34" font-weight="800">[000]</text>
    <text x="142" y="190" fill="#BFDBFE" font-size="13">/ [Max Score]</text>

    <!-- Badge Level -->
    <rect x="75" y="240" width="210" height="26" rx="13" fill="rgba(255,255,255,0.2)"/>
    <text x="90" y="258" fill="#FFFFFF" font-size="12" font-weight="700">[Level / Grade Badge Placeholder]</text>

    <!-- Quick Stats Cards -->
    <g transform="translate(18, 302)">
      <rect width="154" height="65" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" fill="#64748B" font-size="11">[Metric 1 Label]</text>
      <text x="14" y="50" fill="#10B981" font-size="15" font-weight="700">[Val] / [Total]</text>
      <text x="110" y="50" fill="#64748B" font-size="11">[%]</text>
    </g>

    <g transform="translate(188, 302)">
      <rect width="154" height="65" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" fill="#64748B" font-size="11">[Metric 2 Label]</text>
      <text x="14" y="50" fill="#2563EB" font-size="15" font-weight="700">[Time Spent]</text>
    </g>

    <!-- Breakdown By Part -->
    <g transform="translate(18, 380)">
      <rect width="324" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" fill="#0F172A" font-size="13" font-weight="700">[Performance Breakdown By Section]</text>

      <text x="14" y="56" fill="#334155" font-size="11">[Section 1 Placeholder Label]</text>
      <text x="240" y="56" fill="#059669" font-size="11" font-weight="700">[Score 1] ([%])</text>
      <rect x="14" y="64" width="296" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="14" y="64" width="236" height="6" rx="3" fill="#10B981"/>

      <text x="14" y="94" fill="#334155" font-size="11">[Section 2 Placeholder Label]</text>
      <text x="240" y="94" fill="#059669" font-size="11" font-weight="700">[Score 2] ([%])</text>
      <rect x="14" y="102" width="296" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="14" y="102" width="222" height="6" rx="3" fill="#10B981"/>

      <text x="14" y="132" fill="#334155" font-size="11">[Section 3 Placeholder Label]</text>
      <text x="240" y="132" fill="#2563EB" font-size="11" font-weight="700">[Score 3] ([%])</text>
      <rect x="14" y="138" width="296" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="14" y="138" width="230" height="6" rx="3" fill="#2563EB"/>
    </g>

    <!-- Bottom Action Buttons -->
    <g transform="translate(18, 545)">
      <rect width="324" height="42" rx="8" fill="#1E3A8A"/>
      <text x="95" y="26" fill="#FFFFFF" font-size="13" font-weight="600">[Primary Action Button CTA]</text>
    </g>

    <g transform="translate(18, 595)">
      <rect width="324" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
      <text x="105" y="26" fill="#2563EB" font-size="13" font-weight="600">[Secondary Action Button]</text>
    </g>

    <!-- Home indicator -->
    <rect x="120" y="724" width="120" height="4" rx="2" fill="#94A3B8"/>
  </g>
</svg>
