<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660" style="background:#1E1E1E; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="adminShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Label -->
  <text x="30" y="24" fill="#8E8E8E" font-size="13" font-weight="600">FIGMA WIREFRAME TEMPLATE • WEB ADMIN PORTAL (PLACEHOLDER WIREFRAME)</text>

  <!-- Admin Desktop Window -->
  <g transform="translate(30, 40)">
    <!-- Browser Window Container -->
    <rect width="960" height="590" rx="12" fill="#F4F6F9" filter="url(#adminShadow)"/>
    <rect width="960" height="590" rx="12" fill="none" stroke="#475569" stroke-width="1"/>

    <!-- Title Bar -->
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 948,0 A 12,12 0 0,1 960,12 L 960,36 L 0,36 Z" fill="#212529"/>
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>

    <!-- Address Bar -->
    <rect x="80" y="8" width="340" height="20" rx="4" fill="#343A40"/>
    <text x="95" y="22" fill="#CED4DA" font-size="11" font-family="monospace">http://[domain]/[admin-route-placeholder]</text>

    <!-- Sidebar -->
    <g transform="translate(0, 36)">
      <rect width="210" height="554" fill="#343A40"/>
      <!-- Brand -->
      <rect width="210" height="48" fill="#343A40"/>
      <line x1="0" y1="48" x2="210" y2="48" stroke="#4B545C" stroke-width="1"/>
      <text x="20" y="30" fill="#FFFFFF" font-size="13" font-weight="700">[Admin Portal Brand / Logo]</text>

      <!-- Nav Items -->
      <g transform="translate(0, 58)">
        <rect width="210" height="38" fill="#007BFF"/>
        <text x="24" y="24" fill="#FFFFFF" font-size="12" font-weight="600">📋 [Navigation Item 1 - Active]</text>

        <g transform="translate(0, 42)">
          <text x="24" y="24" fill="#C2C7D0" font-size="12">👥 [Navigation Item 2]</text>
        </g>
        <g transform="translate(0, 84)">
          <text x="24" y="24" fill="#C2C7D0" font-size="12">📊 [Navigation Item 3]</text>
        </g>
        <g transform="translate(0, 126)">
          <text x="24" y="24" fill="#C2C7D0" font-size="12">⚙️ [Navigation Item 4]</text>
        </g>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(230, 50)">
      <!-- Metric Cards -->
      <g transform="translate(0, 0)">
        <!-- Card 1 -->
        <rect width="165" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <rect width="4" height="70" rx="2" fill="#007BFF"/>
        <text x="14" y="34" fill="#212529" font-size="22" font-weight="700">[00]</text>
        <text x="14" y="52" fill="#6C757D" font-size="11">[Metric Label 1]</text>

        <!-- Card 2 -->
        <g transform="translate(180, 0)">
          <rect width="165" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <rect width="4" height="70" rx="2" fill="#28A745"/>
          <text x="14" y="34" fill="#212529" font-size="22" font-weight="700">[00]</text>
          <text x="14" y="52" fill="#6C757D" font-size="11">[Metric Label 2]</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(360, 0)">
          <rect width="165" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <rect width="4" height="70" rx="2" fill="#FFC107"/>
          <text x="14" y="34" fill="#212529" font-size="22" font-weight="700">[000]</text>
          <text x="14" y="52" fill="#6C757D" font-size="11">[Metric Label 3]</text>
        </g>

        <!-- Card 4 -->
        <g transform="translate(540, 0)">
          <rect width="165" height="70" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <rect width="4" height="70" rx="2" fill="#17A2B8"/>
          <text x="14" y="34" fill="#212529" font-size="22" font-weight="700">[00.0]</text>
          <text x="14" y="52" fill="#6C757D" font-size="11">[Metric Label 4]</text>
        </g>
      </g>

      <!-- Document Upload Box -->
      <g transform="translate(0, 85)">
        <rect width="705" height="110" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
        <text x="16" y="24" fill="#333333" font-size="13" font-weight="700">📤 [Document Upload / Importer Section Placeholder]</text>
        <line x1="16" y1="34" x2="689" y2="34" stroke="#E9ECEF" stroke-width="1"/>

        <!-- Drag drop inner -->
        <rect x="16" y="44" width="673" height="52" rx="6" fill="#F8FAFF" stroke="#007BFF" stroke-width="1.5" stroke-dasharray="6,4"/>
        <text x="180" y="70" fill="#007BFF" font-size="12" font-weight="600">[Drag and Drop File Area Placeholder - Click or Drop File Here]</text>
        <text x="175" y="86" fill="#6C757D" font-size="10">[Supported File Formats, Tag Guidance, and Parsing Validation Notes Placeholder]</text>
      </g>

      <!-- Data Table -->
      <g transform="translate(0, 210)">
        <rect width="705" height="180" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
        <text x="16" y="24" fill="#333333" font-size="13" font-weight="700">[Data Table Title / Management Records Placeholder]</text>
        <line x1="16" y1="34" x2="689" y2="34" stroke="#E9ECEF" stroke-width="1"/>

        <!-- Table Header -->
        <rect x="16" y="44" width="673" height="28" fill="#E9ECEF"/>
        <text x="28" y="62" fill="#495057" font-size="11" font-weight="700">[#]</text>
        <text x="55" y="62" fill="#495057" font-size="11" font-weight="700">[Item Name Column]</text>
        <text x="240" y="62" fill="#495057" font-size="11" font-weight="700">[Duration Col]</text>
        <text x="330" y="62" fill="#495057" font-size="11" font-weight="700">[Total Count]</text>
        <text x="410" y="62" fill="#495057" font-size="11" font-weight="700">[Status Col]</text>
        <text x="510" y="62" fill="#495057" font-size="11" font-weight="700">[Actions Column]</text>

        <!-- Table Row 1 -->
        <line x1="16" y1="108" x2="689" y2="108" stroke="#E9ECEF" stroke-width="1"/>
        <text x="28" y="94" fill="#212529" font-size="11">1</text>
        <text x="55" y="94" fill="#007BFF" font-size="11" font-weight="600">[Item Name Title Placeholder 1]</text>
        <text x="240" y="94" fill="#495057" font-size="11">[Duration]</text>
        <text x="330" y="94" fill="#495057" font-size="11">[Count]</text>
        <rect x="410" y="80" width="70" height="20" rx="4" fill="#28A745"/>
        <text x="418" y="94" fill="#FFFFFF" font-size="10" font-weight="700">[Status 1]</text>

        <!-- Action Buttons -->
        <rect x="510" y="80" width="60" height="22" rx="4" fill="#17A2B8"/>
        <text x="516" y="95" fill="#FFFFFF" font-size="10">[Action 1]</text>
        <rect x="580" y="80" width="55" height="22" rx="4" fill="#6C757D"/>
        <text x="586" y="95" fill="#FFFFFF" font-size="10">[Action 2]</text>
        <rect x="645" y="80" width="36" height="22" rx="4" fill="#DC3545"/>
        <text x="650" y="95" fill="#FFFFFF" font-size="10">[Act 3]</text>

        <!-- Table Row 2 -->
        <text x="28" y="130" fill="#212529" font-size="11">2</text>
        <text x="55" y="130" fill="#212529" font-size="11" font-weight="600">[Item Name Title Placeholder 2]</text>
        <text x="240" y="130" fill="#495057" font-size="11">[Duration]</text>
        <text x="330" y="130" fill="#495057" font-size="11">[Count]</text>
        <rect x="410" y="116" width="70" height="20" rx="4" fill="#6C757D"/>
        <text x="418" y="130" fill="#FFFFFF" font-size="10" font-weight="700">[Status 2]</text>
        <rect x="510" y="116" width="60" height="22" rx="4" fill="#17A2B8"/>
        <text x="516" y="131" fill="#FFFFFF" font-size="10">[Action 1]</text>
        <rect x="580" y="116" width="55" height="22" rx="4" fill="#6C757D"/>
        <text x="586" y="131" fill="#FFFFFF" font-size="10">[Action 2]</text>
        <rect x="645" y="116" width="36" height="22" rx="4" fill="#DC3545"/>
        <text x="650" y="131" fill="#FFFFFF" font-size="10">[Act 3]</text>
      </g>

      <!-- Statistical Analytics Chart -->
      <g transform="translate(0, 405)">
        <rect width="705" height="115" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
        <text x="16" y="22" fill="#333333" font-size="12" font-weight="700">📊 [Statistical Distribution Chart / Analytics Placeholder]:</text>

        <!-- Histogram bars -->
        <g transform="translate(40, 35)">
          <rect x="0" y="40" width="80" height="15" rx="2" fill="#E0F2FE"/>
          <text x="24" y="34" fill="#0369A1" font-size="10">[Val 1]</text>
          <text x="14" y="68" fill="#64748B" font-size="9">[Range 1]</text>

          <rect x="110" y="25" width="80" height="30" rx="2" fill="#BAE6FD"/>
          <text x="134" y="20" fill="#0369A1" font-size="10">[Val 2]</text>
          <text x="120" y="68" fill="#64748B" font-size="9">[Range 2]</text>

          <rect x="220" y="10" width="80" height="45" rx="2" fill="#38BDF8"/>
          <text x="244" y="5" fill="#0369A1" font-size="10">[Val 3]</text>
          <text x="230" y="68" fill="#64748B" font-size="9">[Range 3]</text>

          <rect x="330" y="0" width="80" height="55" rx="2" fill="#0284C7"/>
          <text x="354" y="-5" fill="#0284C7" font-size="10" font-weight="700">[Peak]</text>
          <text x="340" y="68" fill="#0284C7" font-size="9" font-weight="700">[Range 4]</text>

          <rect x="440" y="30" width="80" height="25" rx="2" fill="#0369A1"/>
          <text x="464" y="25" fill="#0369A1" font-size="10">[Val 5]</text>
          <text x="450" y="68" fill="#64748B" font-size="9">[Range 5]</text>
        </g>
      </g>
    </g>
  </g>
</svg>
